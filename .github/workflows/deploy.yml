name: Deployment Readiness

on:
  workflow_dispatch:
    inputs:
      target:
        description: Intended deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - staging
          - production

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  BUN_VERSION: "1.3.14"

jobs:
  validate:
    name: Validate ${{ inputs.target }} Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run presubmit gates
        run: bun run presubmit

      - name: Build release assets
        run: |
          bun run build
          bun run build:cli

      - name: Prepare desktop engine
        run: bun run --cwd packages/desktop-electron prepare:package

      - name: Package readiness assets
        shell: bash
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          tar -czf "release-assets/openstar-web-${{ inputs.target }}.tar.gz" -C packages/ui-web/dist .
          tar -czf "release-assets/openstar-cli-${{ inputs.target }}.tar.gz" -C packages/cli/bin .
          tar -czf "release-assets/openstar-desktop-engine-${{ inputs.target }}.tar.gz" -C packages/desktop-electron/build/engine .

      - name: Upload readiness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openstar-${{ inputs.target }}-readiness-${{ github.run_number }}
          path: release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Write readiness summary
        shell: bash
        run: |
          echo "## Deployment readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Intended target: ${{ inputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Quality gates: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release assets: built and uploaded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remote deployment: not performed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No deployment provider or credentials are configured in this workflow, so no remote environment was modified." >> "$GITHUB_STEP_SUMMARY"
