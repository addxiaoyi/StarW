name: OpenStar Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  BUN_VERSION: "1.3.14"

jobs:
  release:
    name: Validate and Create Draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run presubmit gates
        run: bun run presubmit

      - name: Build release assets
        run: |
          bun run build
          bun run build:cli

      - name: Prepare desktop engine
        run: bun run --cwd packages/desktop-electron prepare:package

      - name: Package release assets
        shell: bash
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          tar -czf "release-assets/openstar-web-${GITHUB_REF_NAME}.tar.gz" -C packages/ui-web/dist .
          tar -czf "release-assets/openstar-cli-${GITHUB_REF_NAME}.tar.gz" -C packages/cli/bin .
          tar -czf "release-assets/openstar-desktop-engine-${GITHUB_REF_NAME}.tar.gz" -C packages/desktop-electron/build/engine .

      - name: Generate changelog
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          case "$TAG_NAME" in
            *preview*) CHANNEL="preview" ;;
            *dev*) CHANNEL="dev" ;;
            *) CHANNEL="stable" ;;
          esac
          bash scripts/changelog.sh --channel "$CHANNEL" --release-tag "$TAG_NAME"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: changelog-draft.md
          draft: true
          files: release-assets/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
